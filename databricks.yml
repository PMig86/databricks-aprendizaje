# This is a Declarative Automation Bundle definition for mi_primer_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: mi_primer_bundle
  uuid: fb6ab4ee-d1e3-4066-bfff-28fcd88d5eb5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL warehouse que ejecuta el dashboard

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-62cfce20-388e.cloud.databricks.com?w=7474650271713040
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
      warehouse_id: 9db7d6a0131aa262
  prod:
    mode: production
    workspace:
      host: https://dbc-62cfce20-388e.cloud.databricks.com?w=7474650271713040
      # We explicitly deploy to /Workspace/Users/poll.cedeno@rocalvi.com to make sure we only have a single copy.
      root_path: /Workspace/Users/poll.cedeno@rocalvi.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
      warehouse_id: 9db7d6a0131aa262
    permissions:
      - user_name: poll.cedeno@rocalvi.com
        level: CAN_MANAGE
